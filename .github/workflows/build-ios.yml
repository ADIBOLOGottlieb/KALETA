# Compile l'app iPhone sur un Mac de GitHub (aucun Mac nécessaire chez vous).
# - Sans secrets Apple : vérifie seulement que l'app iOS compile (build non signé, non installable).
# - Avec les secrets Apple (compte Apple Developer, 99 $/an) : signe l'app et l'envoie sur TestFlight
#   (App Store Connect), d'où on l'installe sur des iPhone de test puis on la soumet à l'App Store.
# Lancement : à chaque push sur main qui touche l'app, ou à la main (Actions → Build iOS → Run workflow).
#
# Secrets (GitHub → Settings → Secrets and variables → Actions) :
#   APPLE_TEAM_ID              identifiant d'équipe (developer.apple.com → Membership, 10 caractères)
#   APPSTORE_API_KEY_ID        App Store Connect → Utilisateurs et accès → Intégrations → Clés API (rôle Admin)
#   APPSTORE_API_ISSUER_ID     même page (« Issuer ID »)
#   APPSTORE_API_PRIVATE_KEY   contenu du fichier AuthKey_XXXX.p8 téléchargé
#   GOOGLE_SERVICE_INFO_PLIST  (facultatif) GoogleService-Info.plist de Firebase (app iOS) : notifications push
name: Build iOS

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/build-ios.yml"]
  workflow_dispatch:
    inputs:
      api_url:
        description: "Adresse de l'API"
        required: true
        default: "https://eza-zozo-api-5fib.onrender.com"

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    env:
      API_URL: ${{ github.event.inputs.api_url || 'https://eza-zozo-api-5fib.onrender.com' }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Mode de build
        run: |
          if [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPSTORE_API_KEY_ID" ] && [ -n "$APPSTORE_API_ISSUER_ID" ] && [ -n "$APPSTORE_API_PRIVATE_KEY" ]; then
            echo "SIGNED=1" >> "$GITHUB_ENV"
            echo "Secrets Apple présents : build signé + envoi sur TestFlight."
          else
            echo "SIGNED=0" >> "$GITHUB_ENV"
            echo "::warning::Secrets Apple absents : build iOS NON signé (vérification de compilation seulement)."
          fi

      # Notifications push iOS : fichier Firebase ajouté au projet Xcode (ressource du target Runner).
      - name: Configuration Firebase iOS
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "::warning::GOOGLE_SERVICE_INFO_PLIST absent : app iOS sans notifications push."
            exit 0
          fi
          if printf "%s" "$GOOGLE_SERVICE_INFO_PLIST" | grep -q "<plist"; then
            printf "%s" "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/GoogleService-Info.plist
          else
            printf "%s" "$GOOGLE_SERVICE_INFO_PLIST" | base64 -d > ios/Runner/GoogleService-Info.plist
          fi
          if ! plutil -lint ios/Runner/GoogleService-Info.plist > /dev/null; then
            echo "::warning::GOOGLE_SERVICE_INFO_PLIST invalide : ignoré."
            rm -f ios/Runner/GoogleService-Info.plist
            exit 0
          fi
          gem list -i xcodeproj > /dev/null || sudo gem install xcodeproj --no-document
          ruby -e '
            require "xcodeproj"
            p = Xcodeproj::Project.open("ios/Runner.xcodeproj")
            t = p.targets.find { |x| x.name == "Runner" }
            g = p.main_group["Runner"]
            ref = g.files.find { |f| f.path == "GoogleService-Info.plist" } || g.new_file("GoogleService-Info.plist")
            t.resources_build_phase.add_file_reference(ref, true)
            p.save'
          echo "PUSH=1" >> "$GITHUB_ENV"
          echo "GoogleService-Info.plist ajouté : notifications push activées."

      - name: Build non signé (vérification)
        if: env.SIGNED == '0'
        run: >-
          flutter build ios --release --no-codesign
          --build-number=${{ github.run_number }}
          --dart-define=API_URL=$API_URL
          --dart-define=APP_VERSION=1.0.0+${{ github.run_number }}

      - name: Archive signée et envoi sur TestFlight
        if: env.SIGNED == '1'
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/keys"
          KEY="$RUNNER_TEMP/keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          printf "%s" "$APPSTORE_API_PRIVATE_KEY" > "$KEY"
          # Génère la configuration Flutter (version, --dart-define) et installe les pods, sans compiler.
          flutter build ios --release --config-only \
            --build-number=${{ github.run_number }} \
            --dart-define=API_URL=$API_URL \
            --dart-define=APP_VERSION=1.0.0+${{ github.run_number }}
          ENTITLEMENTS=""
          if [ "${PUSH:-0}" = "1" ]; then ENTITLEMENTS="CODE_SIGN_ENTITLEMENTS=Runner/Runner.entitlements"; fi
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$APPSTORE_API_KEY_ID" -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID")
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic $ENTITLEMENTS \
            "${AUTH[@]}" archive | tail -n 40
          sed "s/__TEAM_ID__/$APPLE_TEAM_ID/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          # destination=upload : l'export envoie directement l'app sur App Store Connect (TestFlight).
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" | tail -n 40
          echo "Envoyé sur App Store Connect : l'app apparaît dans TestFlight après le traitement par Apple (10 à 30 min)."

      - name: Artefact (build non signé)
        if: env.SIGNED == '0'
        run: cd build/ios/iphoneos && zip -qr ../../../ios-non-signe.zip Runner.app
      - uses: actions/upload-artifact@v4
        if: env.SIGNED == '0'
        with:
          name: kaleta-ios-non-signe
          path: mobile/ios-non-signe.zip
