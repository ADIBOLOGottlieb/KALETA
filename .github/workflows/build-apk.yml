# Compile l'APK Android sur les serveurs de GitHub (utile si Windows bloque Flutter).
# Se lance tout seul à chaque push sur main qui touche l'app mobile, ou à la main :
# GitHub → onglet « Actions » → « Build APK » → « Run workflow ».
# L'APK se télécharge dans la section « Artifacts » du résultat.
name: Build APK

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:
    inputs:
      api_url:
        description: "Adresse de l'API (ex : https://eza-zozo-api-5fib.onrender.com ou https://mon-api.com)"
        required: true
        default: "https://eza-zozo-api-5fib.onrender.com"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Liste toutes les erreurs de compilation d'un coup (les avertissements ne bloquent pas).
      # Chaque erreur devient une annotation visible sur la page du build.
      - name: dart analyze
        run: |
          set +e
          dart analyze --no-fatal-warnings --format=machine > analyze.txt 2>&1
          code=$?
          grep '^ERROR' analyze.txt | while IFS='|' read -r sev type rule file line col len msg; do
            echo "::error file=${file#$GITHUB_WORKSPACE/},line=$line,col=$col::$msg"
          done
          exit $code
      - run: flutter test
      # Signature fixe : secrets ANDROID_KEYSTORE_BASE64 (fichier .jks encodé en base64) et
      # ANDROID_KEYSTORE_PASSWORD. Même empreinte SHA-1 à chaque build, donc la clé Google Maps
      # peut être restreinte à l'app et les mises à jour s'installent par-dessus. Sans secrets :
      # signature de débogage (empreinte différente à chaque build).
      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::Secrets de signature absents : APK signé avec une clé de débogage."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=ezazozo"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/key.properties
          # Empreinte SHA-1 envoyée par l'app avec ses requêtes Google (clé restreinte Android).
          sha1=$(keytool -list -v -keystore android/app/upload.jks -storepass "$KEYSTORE_PASSWORD" -alias ezazozo | awk '/SHA1:/ {print $2}')
          echo "Empreinte SHA-1 : $sha1"
          echo "CERT_SHA1=$sha1" >> "$GITHUB_ENV"
      # Notifications push (Firebase) : secret GOOGLE_SERVICES_JSON = contenu de google-services.json
      # (brut ou encodé en base64), téléchargé depuis la console Firebase pour l'app Android
      # com.kaleta.app. Sans secret : APK construit sans notifications push.
      - name: Configuration Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::Secret GOOGLE_SERVICES_JSON absent : APK sans notifications push."
            exit 0
          fi
          if printf "%s" "$GOOGLE_SERVICES_JSON" | sed "s/^[[:space:]]*//" | grep -q "^{"; then
            printf "%s" "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            printf "%s" "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json 2>/dev/null || true
          fi
          # Fichier invalide ou d'une autre app : on le retire pour que le build réussisse quand même.
          if ! jq -e ".client[] | select(.client_info.android_client_info.package_name == \"com.kaleta.app\")" android/app/google-services.json > /dev/null 2>&1; then
            echo "::warning::GOOGLE_SERVICES_JSON invalide ou sans l'app com.kaleta.app : APK sans notifications push."
            rm -f android/app/google-services.json
            exit 0
          fi
          echo "google-services.json écrit : notifications push activées."
      # Clé Google Maps (restreinte au package Android + SHA-1) : secret GitHub GOOGLE_MAPS_API_KEY.
      # Sans secret, la valeur est vide et l'app utilise automatiquement OpenStreetMap.
      # APP_VERSION : version envoyée avec les rapports de plantage (journal des erreurs du gérant).
      - run: >-
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --dart-define=API_URL=${{ github.event.inputs.api_url || 'https://eza-zozo-api-5fib.onrender.com' }}
          --dart-define=GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
          --dart-define=GOOGLE_ANDROID_CERT_SHA1=${{ env.CERT_SHA1 || secrets.GOOGLE_ANDROID_CERT_SHA1 }}
          --dart-define=APP_VERSION=1.0.0+${{ github.run_number }}
      # App Bundle (.aab) pour le Google Play Store : mêmes options que l'APK.
      - run: >-
          flutter build appbundle --release
          --build-number=${{ github.run_number }}
          --dart-define=API_URL=${{ github.event.inputs.api_url || 'https://eza-zozo-api-5fib.onrender.com' }}
          --dart-define=GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
          --dart-define=GOOGLE_ANDROID_CERT_SHA1=${{ env.CERT_SHA1 || secrets.GOOGLE_ANDROID_CERT_SHA1 }}
          --dart-define=APP_VERSION=1.0.0+${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: kaleta-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kaleta-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
      # Publication automatique sur Google Play (piste « Tests internes », en brouillon) si le secret
      # PLAY_SERVICE_ACCOUNT_JSON existe : compte de service Google Cloud invité dans la Play Console
      # (Utilisateurs et autorisations → droit « Publier sur les pistes de test »).
      # La TOUTE PREMIÈRE version doit être envoyée à la main dans la Play Console (Google l'exige) ;
      # ensuite chaque build est envoyé ici, et il suffit de le promouvoir en production dans la console.
      - name: Vérifier le secret Google Play
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then echo "enabled=1" >> "$GITHUB_OUTPUT"; else echo "Secret PLAY_SERVICE_ACCOUNT_JSON absent : pas d'envoi sur Google Play."; fi
      - name: Envoi sur Google Play (tests internes)
        if: steps.play.outputs.enabled == '1'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.kaleta.app
          releaseFiles: mobile/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
