name: kaleta
description: "KALETA Terrasse & Lounge - commande en ligne et administration du restaurant."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  http_parser: ^4.1.0
  shared_preferences: ^2.3.3
  # Jeton de connexion chiffré (Keystore Android).
  flutter_secure_storage: ^10.0.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  geolocator: ^11.1.0
  flutter_map: ^8.0.0
  latlong2: ^0.9.1
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.2
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  # Sonnerie des nouvelles commandes (espace gérant).
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
  fonts:
    # Titres (comme le site du restaurant). Sous-ensemble latin : accents français inclus.
    - family: Playfair
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlayfairDisplay-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/PlayfairDisplay-Black.ttf
          weight: 900
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo.png
  remove_alpha_ios: true
  adaptive_icon_background: "#03150F"
  adaptive_icon_foreground: assets/images/logo_foreground.png
  adaptive_icon_foreground_inset: 0
